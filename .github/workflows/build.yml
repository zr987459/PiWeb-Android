name: Build Pi Web APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/*.apk output/PiWeb.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiWeb-APK
          path: output/PiWeb.apk

      - name: Delete old release
        run: |
          gh release delete v1.0.0 -y --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Pi Web v1.0.0"
          body: "### Pi Web 独立客户端 v1.0.0\n- 极简沉浸全屏连接 127.0.0.1:30141\n- 避开第三方浏览器 Loopback 限制\n- 未就绪时优雅重连探测"
          files: output/PiWeb.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
