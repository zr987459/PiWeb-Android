name: Build Pi Web APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug

      - name: Get Release APK
        run: |
          mkdir -p output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output/PiWeb.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiWeb-APK
          path: output/PiWeb.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "Pi Web v1.0.0"
          body: "### Pi Web 独立客户端 v1.0.0\n- 全屏极简沉浸 WebView 访问 127.0.0.1:30141\n- 支持服务未就绪时自动轮询重连与状态显示"
          files: output/PiWeb.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
